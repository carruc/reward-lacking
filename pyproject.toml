[project]
name = "reward-lacking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pietro Carrucciu", email = "pietro@carrucciu.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
    "timm>=1.0.31",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.0",
]

[project.scripts]
download-dataset = "data.download:main"
build-gallery = "data.gallery.build_manifest:main"
serve-gallery = "data.gallery.serve:main"
apply-annotations = "data.gallery.apply_annotations:main"
clean-dataset = "data.cleaning:main"
train-model = "model.train:main"
run-fold0-queue = "model.run_queue:main"
train-dinov2 = "model.dinov2:main"
build-clusters = "data.gallery.build_clusters:main"
eval-overlap = "eval.embedding_overlap:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["data", "eval", "model"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

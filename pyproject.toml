[project]
name = "reward-lacking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pietro Carrucciu", email = "pietro@carrucciu.com" }
]
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
download-dataset = "data.download:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["data", "eval", "model"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

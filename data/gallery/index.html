<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy10 DECaLS gallery</title>
<style>
  :root {
    --tile: 168px;      /* controlled by the size slider */
    --bg: #0b0d10;
    --panel: #15181d;
    --line: #262b33;
    --fg: #d7dce3;
    --dim: #8b95a3;
    --accent: #4f9cf9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; letter-spacing: .2px; }
  h1 span { color: var(--dim); font-weight: 400; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
    border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12.5px;
    user-select: none; white-space: nowrap;
  }
  .chip small { color: var(--dim); }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.on small { color: #e5eefc; }
  input[type=text] {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 180px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  select {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 6px 8px; font-size: 13px; outline: none;
  }
  input[type=range] { accent-color: var(--accent); }
  .count { color: var(--dim); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
  main {
  padding: 14px 16px 60vh; /* bottom padding keeps sentinel reachable past last row */
}
#boot-error {
  max-width: 760px;
  margin: 4px auto 16px;
  padding: 10px 14px;
  border: 1px solid #b3564d;
  border-radius: 8px;
  background: #2a1717;
  color: #f2c4bd;
  font-size: 13px;
  line-height: 1.55;
}
#boot-error code {
  color: #fff;
  background: none;
  padding: 0;
}
#boot-error strong {
  color: #ff9d8f;
}
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: 8px;
  }
  .tile {
    position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); cursor: zoom-in;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .tag {
    position: absolute; left: 0; bottom: 0; right: 0;
    font-size: 10.5px; padding: 2px 5px;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    display: flex; justify-content: space-between; gap: 4px;
  }
  .tile .tag .cls { color: #fff; font-weight: 600; }
  .tile .tag .sp { color: var(--dim); }
  .tile.test img { opacity: .82; }
  #sentinel { height: 10px; }
  #empty { color: var(--dim); padding: 40px 0; text-align: center; }
  #boot-error {
    max-width: 760px;
    margin: 4px auto 16px;
    padding: 12px 16px;
    border: 1px solid #b3564d;
    border-radius: 8px;
    background: #2a1717;
    color: #f2c4bd;
    font-size: 13px;
    line-height: 1.55;
  }
  #boot-error code {
    color: #fff;
    background: none;
    padding: 0;
  }
  #boot-error strong {
    color: #ff9d8f;
  }
  #boot-error {
    max-width: 760px; margin: 4px auto 16px; padding: 12px 16px;
    border: 1px solid #b3564d; border-radius: 8px;
    background: #2a1717; color: #f2c4bd;
    font-size: 13px; line-height: 1.55;
  }
  #boot-error code { color: #fff; background: none; padding: 0; }
  #boot-error strong { color: #ff9d8f; }
  /* lightbox */
  #lb {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(0,0,0,.92); align-items: center; justify-content: center; flex-direction: column;
  }
  #lb.open { display: flex; }
  #lb img { max-width: min(92vw, 720px); max-height: 78vh; border-radius: 4px; }
  #lb .meta { margin-top: 12px; font-size: 14px; color: var(--fg); text-align: center; }
  #lb .meta .cls { font-weight: 700; }
  #lb .hint { margin-top: 6px; color: var(--dim); font-size: 12px; }
  #lb .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 40px; color: var(--dim); background: none; border: none; cursor: pointer; padding: 20px;
  }
  #lb .nav:hover { color: #fff; }
  #lb .prev { left: 6px; } #lb .next { right: 6px; }
  #lb .close { position: absolute; top: 10px; right: 16px; font-size: 26px; color: var(--dim);
               background: none; border: none; cursor: pointer; }
  #lb .close:hover { color: #fff; }

  /* labels (right-click editor) */
  #grid .tag-count {
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }
  .tile-tags {
    position: absolute;
    top: 4px;
    left: 4px;
    right: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    pointer-events: none; /* clicks fall through to the tile */
    z-index: 2;
  }
  .tile-tag {
    background: color-mix(in srgb, var(--accent) 82%, #000 18%);
    color: #fff;
    border-radius: 999px;
    padding: 1.5px 7px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .2px;
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, .25);
  }
  #lb .lb-tags {
    color: var(--dim);
  }
  #ann {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .72);
  }
  #ann.open { display: flex; }
  #ann .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    width: min(92vw, 430px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
  }
  #ann .thumb {
    float: right;
    width: 88px;
    height: 88px;
    margin: 0 0 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    object-fit: cover;
  }
  #ann h2 {
    margin: 4px 0;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .2px;
    overflow-wrap: anywhere;
  }
  #ann .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 24px;
    align-items: center;
  }
  #ann .tags:empty::after {
    content: "no labels yet";
    color: var(--dim);
    font-size: 12px;
  }
  #ann .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 999px;
    padding: 2px 6px 2px 10px;
    font-size: 12px;
  }
  #ann .tag button {
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 2px;
  }
  #ann .tag button:hover {
    color: #fff;
  }
  #ann .addrow {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  #ann .addrow input[type=text] {
    flex: 1;
    width: auto;
  }
  #ann .hint {
    color: var(--dim);
    font-size: 11.5px;
    margin-top: 8px;
  }
  #ann .hint code {
    color: var(--fg);
  }
  #ann .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 title="Right-click toggles the 'alien' tag on an image; Shift+right-click opens the full label editor.">Galaxy10 DECaLS <span>browse</span></h1>
    <input id="q" type="text" placeholder="filter by id (e.g. 0123)" spellcheck="false">
    <span class="chips" id="splitChips"></span>
    <select id="sort" title="order">
      <option value="id">id ↑</option>
      <option value="iddesc">id ↓</option>
      <option value="class">class</option>
    </select>
    <button class="chip" id="shuffle" title="Shuffle the current view">&#x1f500; shuffle</button>
    <label class="chip" title="thumbnail size">size <input id="size" type="range" min="110" max="320" value="168" step="10"></label>
    <button class="chip" id="save-annotations" title="Save labels to data/gallery/annotations.json">&#x1f3f7; save</button>
    <button class="chip" id="apply-annotations" title="Merge saved labels into artifacts/dataset/train.csv (extra_labels column)">&#x2192; train.csv</button>
    <span class="count" id="count"></span>
    <span class="count" id="save-status"></span>
  </div>
  <div class="row" style="margin-top:8px">
    <span class="chips" id="classChips"></span>
  </div>
</header>

<main>
  <div id="boot-error" hidden></div>
  <div id="grid"></div>
  <div id="empty" hidden>No images match the current filters.</div>
  <div id="sentinel"></div>
</main>

<div id="lb" role="dialog" aria-modal="true">
  <button class="nav prev" aria-label="previous">&#x2039;</button>
  <img id="lbImg" alt="">
  <div class="meta" id="lbMeta"></div>
  <div class="hint">← → to move, Esc to close</div>
  <button class="nav next" aria-label="next">&#x203a;</button>
  <button class="close" aria-label="close">&#x2715;</button>
</div>

<div id="ann" role="dialog" aria-modal="true">
  <div class="panel">
    <img id="ann-img" class="thumb" alt="">
    <h2 id="ann-title"></h2>
    <div id="ann-tags" class="tags"></div>
    <div class="addrow">
      <input id="ann-input" type="text" list="ann-suggestions" placeholder="add label — Enter to confirm" spellcheck="false">
      <datalist id="ann-suggestions"></datalist>
      <button class="chip" id="ann-add">add</button>
    </div>
    <div class="hint">Enter adds a label, &#x2715; removes it. Saved to <code>data/gallery/annotations.json</code> when the dialog closes.</div>
    <div class="actions">
      <button class="chip on" id="ann-done">done</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* Galaxy10 DECaLS class names (astronn). Edit here if your labels differ. */
const CLASSES = [
  "Disturbed", "Merging", "Round Smooth", "In-between Round Smooth",
  "Cigar Smooth", "Barred Spiral", "Unbarred Tight Spiral",
  "Unbarred Loose Spiral", "Edge-on no Bulge", "Edge-on with Bulge",
];
const CLASS_COLOR = ["#e05c5c","#e08b3c","#e6c74a","#7ac74a","#4fc98e",
                     "#4fb9d8","#5b7bf0","#9a6df0","#d35fbe","#c9998a"];
const PAGE = 120; // tiles rendered per chunk

let manifest = [];          // [{id, split, label}]
let filtered = [];          // indexes into manifest
let rendered = 0;
let state = { cls: "all", split: "all", q: "", sort: "id" };
let datasetRoot = null;     // resolved at boot (/api/dataset-root first, then probing)
let triedRoots = [];

const $ = (s) => document.querySelector(s);
const grid = $("#grid"), sentinel = $("#sentinel"), lb = $("#lb");
let lbIndex = -1;

const imgSrc = (m) => `${datasetRoot}/${m.split}/${m.id}.png`;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const clsName = (l) => l === null ? "unlabelled" : `class ${l}: ${CLASSES[l] ?? "?"}`;

/* ---------- filtering ---------- */
function applyFilters() {
  const q = state.q;
  const out = [];
  for (let i = 0; i < manifest.length; i++) {
    const m = manifest[i];
    if (state.split !== "all" && m.split !== state.split) continue;
    if (state.cls !== "all" && m.label !== state.cls) continue; // test items have no label -> excluded
    if (q && !m.id.includes(q)) continue;
    out.push(i);
  }
  if (state.sort === "class") {
    out.sort((a, b) => (manifest[a].label ?? 99) - (manifest[b].label ?? 99) || manifest[a].id.localeCompare(manifest[b].id));
  } else if (state.sort === "iddesc") {
    out.sort((a, b) => manifest[b].id.localeCompare(manifest[a].id));
  } else {
    out.sort((a, b) => manifest[a].id.localeCompare(manifest[b].id));
  }
  filtered = out;
  rendered = 0;
  grid.innerHTML = "";
  $("#empty").hidden = filtered.length > 0;
  updateCount();
  renderChunk();
}

function updateCount() {
  const n = filtered.length;
  $("#count").textContent = `showing ${n.toLocaleString()} / ${manifest.length.toLocaleString()}`;
}

function renderChunk() {
  const end = Math.min(rendered + PAGE, filtered.length);
  let html = "";
  for (; rendered < end; rendered++) {
    const m = manifest[filtered[rendered]];
    const tags = annotations[m.id] || [];
    const chips = tags.length > 0
      ? `<div class="tile-tags">${tags.map((t) => `<span class="tile-tag">${esc(t)}</span>`).join("")}</div>`
      : "";
    const tag = m.label === null
      ? `<span class="cls"></span><span class="sp">test</span>`
      : `<span class="cls" style="color:${color(m.label)}">${m.label} · ${CLASSES[m.label] ?? "?"}</span><span class="sp">train</span>`;
    html += `<div class="tile ${m.label === null ? "test" : ""}" data-i="${rendered}" title="${esc(`${m.id} — ${clsName(m.label)}${tags.length ? " · labels: " + tags.join(", ") : ""}`)}">
               <img loading="lazy" decoding="async" src="${imgSrc(m)}" alt="${m.id}">
               ${chips}
               <div class="tag">${tag}</div>
             </div>`;
  }
  grid.insertAdjacentHTML("beforeend", html);
}

const color = (l) => `hsl(${(l * 36 + 10) % 360} 62% 62%)`;

/* ---------- controls ---------- */
function buildChips() {
  const counts = {}; // class -> train count
  for (const m of manifest) if (m.label !== null) counts[m.label] = (counts[m.label] || 0) + 1;

  const sc = $("#splitChips");
  sc.innerHTML = "";
  for (const [val, label, n] of [["all","all",manifest.length],
                                 ["train","train",manifest.filter(m=>m.split==='train').length],
                                 ["test","test",manifest.filter(m=>m.split==='test').length]]) {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.split = val;
    b.innerHTML = `${label} <small>${n.toLocaleString()}</small>`;
    b.onclick = () => { state.split = val; syncChips(); applyFilters(); };
    sc.appendChild(b);
  }

  const cc = $("#classChips");
  cc.innerHTML = "";
  const mk = (val, label, n) => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.cls = val;
    b.innerHTML = `${label} <small>${n}</small>`;
    b.onclick = () => {
      state.cls = val === state.cls && val !== "all" ? "all" : val;
      syncChips(); applyFilters();
    };
    cc.appendChild(b);
  };
  mk("all", "All classes", manifest.filter(m => m.split === "train").length);
  CLASSES.forEach((name, l) => mk(l, `${l} ${name}`, counts[l] || 0));
  syncChips();
}

function syncChips() {
  document.querySelectorAll("#classChips .chip").forEach(b =>
    b.classList.toggle("on", String(state.cls) === b.dataset.cls));
  document.querySelectorAll("#splitChips .chip").forEach(b =>
    b.classList.toggle("on", state.split === b.dataset.split));
}

let debounce;
$("#q").addEventListener("input", (e) => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { state.q = e.target.value.trim(); applyFilters(); }, 150);
});
$("#sort").addEventListener("change", (e) => { state.sort = e.target.value; applyFilters(); });
$("#shuffle").onclick = () => {
  for (let i = filtered.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  rendered = 0; grid.innerHTML = ""; renderChunk();
};
$("#size").addEventListener("input", (e) =>
  document.documentElement.style.setProperty("--tile", e.target.value + "px"));

/* ---------- lightbox ---------- */
function openLightbox(i) {
  lbIndex = i;
  const m = manifest[filtered[i]];
  $("#lbImg").src = imgSrc(m);
  $("#lbMeta").innerHTML =
    `<span class="cls" style="color:${m.label === null ? "var(--dim)" : color(m.label)}">
       ${m.id}.png</span><br>${clsName(m.label)} · ${m.split}`;
  lb.classList.add("open");
}
const move = (d) => lb.classList.contains("open") && filtered.length &&
  openLightbox((lbIndex + d + filtered.length) % filtered.length);

grid.addEventListener("click", (e) => {
  const t = e.target.closest(".tile");
  if (t) openLightbox(+t.dataset.i);
});
$(".close").onclick = () => lb.classList.remove("open");
$(".prev").onclick = () => move(-1);
$(".next").onclick = () => move(1);
lb.addEventListener("click", (e) => { if (e.target === lb) lb.classList.remove("open"); });
document.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("open") || $("#ann").classList.contains("open")) return;
  if (e.key === "Escape") lb.classList.remove("open");
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "ArrowRight") move(1);
});

/* ---------- infinite scroll ---------- */
new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting && rendered < filtered.length) renderChunk();
}, { rootMargin: "1400px" }).observe(sentinel);

/* ---------- labels (right-click) ---------- */
const SUGGESTED_TAGS = ["alien", "superexposed", "duplicate", "corrupted", "mislabelled"];
const LOCAL_KEY = "galaxy-gallery-annotations";
let annotations = {};      // image id -> array of labels (loaded from the server, mirrored to localStorage)
let apiAlive = true;       // false when no /api backend (e.g. served by a plain http.server)

const tagsOf = (id) => (annotations[id] || (annotations[id] = []));

let saveTimer = null;

const setStatus = (text) => { $("#save-status").textContent = text; };
const countTagged = () => Object.values(annotations).filter((tags) => tags.length > 0).length;

/** Merge server-stored labels with any newer local edits. */
function unionTags(id, tags) {
  annotations[id] = [...new Set([...(annotations[id] || []), ...tags])];
}

function closeTagEditor() {
  $("#ann").classList.remove("open");
  annId = null;
  applyFilters(); // refresh the label badges
}

function scheduleSave() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(annotations));
  setStatus("saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 500);
}

async function flushSave() {
  clearTimeout(saveTimer);
  localStorage.setItem(LOCAL_KEY, JSON.stringify(annotations));
  if (!apiAlive) return;
  try {
    const res = await fetch("/api/annotations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(annotations),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    setStatus(`${countTagged()} tagged · saved`);
  } catch (err) {
    console.error(err);
    apiAlive = false;
    setStatus("saved in browser only (no server)");
  }
}

/* tag editor dialog */
let annId = null;

function openTagEditor(id) {
  annId = id;
  const m = manifest.find((x) => x.id === id);
  $("#ann-img").src = imgSrc(m);
  $("#ann-title").textContent = `${id} · ${m.split}${m.label === null ? "" : ", class " + m.label}`;
  renderTagChips();
  refreshSuggestions();
  $("#ann-input").value = "";
  $("#ann").classList.add("open");
  $("#ann-input").focus();
}

function renderTagChips() {
  const box = $("#ann-tags");
  box.innerHTML = "";
  for (const t of annotations[annId] || []) {
    const chip = document.createElement("span");
    chip.className = "tag";
    chip.textContent = t;
    const rm = document.createElement("button");
    rm.textContent = "✕";
    rm.title = "remove label";
    rm.onclick = () => removeTag(t);
    chip.appendChild(rm);
    box.appendChild(chip);
  }
}

function addTag() {
  const text = $("#ann-input").value.trim().toLowerCase();
  if (!text || !annId) return;
  if (!tagsOf(annId).includes(text)) {
    tagsOf(annId).push(text);
    scheduleSave();
    renderTagChips();
  }
  $("#ann-input").value = "";
  refreshSuggestions();
  $("#ann-input").focus();
}

function removeTag(t) {
  if (!annId) return;
  const tags = (annotations[annId] || []).filter((x) => x !== t);
  if (tags.length > 0) annotations[annId] = tags;
  else delete annotations[annId];
  scheduleSave();
  renderTagChips();
}

function usedTags() {
  const s = new Set();
  for (const tags of Object.values(annotations)) tags.forEach((t) => s.add(t));
  return [...s].sort();
}

function refreshSuggestions() {
  $("#ann-suggestions").innerHTML =
    [...new Set([...SUGGESTED_TAGS, ...usedTags()])].map((t) => `<option value="${esc(t)}">`).join("");
}

$("#ann-input").addEventListener("keydown", (e) => { if (e.key === "Enter") addTag(); });
$("#ann-add").onclick = addTag;
$("#ann-done").onclick = () => { flushSave(); closeTagEditor(); };
$("#ann").addEventListener("click", (e) => { if (e.target === $("#ann")) { flushSave(); closeTagEditor(); } });

/* right-click to label, from both the grid and the lightbox */
const QUICK_TAG = "alien"; // toggled with a plain right-click

const hasQuickTag = (id) => (annotations[id] ? annotations[id].includes(QUICK_TAG) : false);

function toggleQuickTag(id) {
  const tags = annotations[id];
  if (tags && tags.includes(QUICK_TAG)) {
    const rest = tags.filter((t) => t !== QUICK_TAG);
    if (rest.length > 0) annotations[id] = rest;
    else delete annotations[id];
  } else {
    tags.push(QUICK_TAG);
  }
  scheduleSave();
  applyTags();
}

grid.addEventListener("contextmenu", (e) => {
  const t = e.target.closest(".tile");
  if (!t) return;
  e.preventDefault();
  toggleQuickTag(manifest[filtered[+t.dataset.i]].id);
});
lb.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  if (!(lbIndex >= 0 && filtered.length > 0)) return;
  toggleQuickTag(manifest[filtered[lbIndex]].id);
});

/* merge saved server annotations with any newer local edits on boot */
async function loadAnnotations() {
  try {
    const res = await fetch("/api/annotations");
    if (res.ok) annotations = await res.json();
    else apiAlive = false;
  } catch { apiAlive = false; }
  try {
    for (const [id, tags] of Object.entries(JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}")))
      unionTags(id, tags);
  } catch {}
  setStatus(`${countTagged()} tagged`);
}

function bootError(title, hint) {
  console.error(title);
  const b = $("#boot-error");
  if (!b) return;
  b.hidden = false;
  b.innerHTML = `<strong>${title}</strong><br>${hint}`;
}

async function resolveDatasetRoot(firstId) {
  const candidates = [];
  try {
    const res = await fetch("/api/dataset-root");
    if (res.ok) candidates.push((await res.json()).root);
  } catch {}
  candidates.push("../../artifacts/dataset", "../dataset", "dataset", "/dataset");
  for (const c of candidates) {
    triedRoots.push(`${c}/train/${firstId}.png`);
    try {
      let res = await fetch(`${c}/train/${firstId}.png`, { method: "HEAD" });
      // Some servers and proxies reply oddly (or not at all) to HEAD: if the
      // probe did not clearly succeed, retry with a small ranged GET.
      if (!res.ok) {
        res = await fetch(`${c}/train/${firstId}.png`, { headers: { Range: "bytes=0-63" } });
      }
      if (res.ok || res.status === 206) return c;
    } catch {}
  }
  return null;
}

/* ---------- boot ---------- */
(async () => {
  // The manifest is generated from the dataset and is not committed: on a
  // fresh checkout this request 404s and the banner above explains what to do.
  try {
    const res = await fetch(`manifest.json?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status} for manifest.json`);
    manifest = await res.json();
  } catch (err) {
    console.error(err);
    bootError(
      `<strong>manifest.json could not be loaded.</strong> The gallery index is generated from the dataset and is not committed.`,
      `Run <code>uv run build-gallery</code> in the repository root, then reload. If <code>artifacts/dataset</code> is empty, first run <code>uv run download-dataset</code>.`
    );
    return;
  }
  if (!Array.isArray(manifest) || manifest.length === 0) {
    bootError(
      `<strong>manifest.json is empty</strong> — no images were found under the dataset root.`,
      `Run <code>uv run download-dataset</code>, then <code>uv run build-gallery</code>, and reload the page.`
    );
    return;
  }
  datasetRoot = await resolveDatasetRoot(manifest[0].id);
  if (datasetRoot === null) {
    bootError(
      `<strong>The dataset images are not reachable from this page.</strong> Probed, in order: ${triedRoots.map((c) => `<code>${esc(c)}</code>`).join(", ")}`,
      `Serve the repository root (so <code>artifacts/dataset</code> is exposed) with <code>./data/gallery/run.sh</code>, or open this page from the repo root. If <code>artifacts/dataset</code> is empty, run <code>uv run download-dataset</code> first, then <code>uv run build-gallery</code>.`
    );
    return;
  }
  await loadAnnotations();
  buildChips();
  applyFilters();
})();
</script>
